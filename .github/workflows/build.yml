name: Build Canta APK

on:
  push:
    branches: ["main","master"]
  pull_request:
    branches: ["main","master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download kode repositori
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Java (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Perbaiki file wrapper jika di-push via Acode (mencegah error corrupted jar)
      # - name: Fix Corrupted Gradle Wrapper JAR
      #  run: |
      #    curl -sL https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar

      # 4. Beri izin eksekusi gradlew
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 5. Kompilasi aplikasi Canta
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 6. Upload file APK hasil kompilasi
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Canta-Debug
          path: app/build/outputs/apk/**/*.apk
